      <text x="100" y="182" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Select Package</text>

      <!-- Package 2 (Active Selected) -->
      <g transform="translate(216, 0)">
        <rect width="200" height="200" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
        <rect x="120" y="8" width="70" height="18" rx="9" fill="#3b82f6" />
        <text x="155" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">POPULAR</text>
        <text x="16" y="32" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">2 BHK Premium</text>
        <text x="16" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Complete sanitized cleaning</text>
