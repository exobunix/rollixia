      <!-- Slot Picker -->
      <g transform="translate(0, 185)">
        <text x="0" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">CHOSEN TIME SLOT</text>
        <rect y="26" width="98" height="42" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
        <text x="49" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">08:00 AM</text>

        <rect x="110" y="26" width="100" height="42" rx="8" fill="#3b82f6" />
        <text x="160" y="52" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">10:00 AM</text>

        <rect x="222" y="26" width="98" height="42" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
        <text x="271" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">02:00 PM</text>
      </g>

      <!-- Price Breakdown -->
      <g transform="translate(0, 275)">
        <rect width="320" height="95" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.06)" />
        <text x="16" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Base Service Fee</text>
        <text x="304" y="26" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">₹2,299</text>

        <text x="16" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Sanitization Kit &amp; Consumables</text>
        <text x="304" y="48" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">₹199</text>

        <line x1="16" y1="62" x2="304" y2="62" stroke="rgba(255,255,255,0.08)" />

        <text x="16" y="82" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="800">Total Payable</text>
        <text x="304" y="82" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" text-anchor="end">₹2,498</text>
      </g>

      <!-- Pay CTA Button -->
