    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <rect x="80" y="10" width="340" height="22" rx="6" fill="#0f172a" />
    <text x="96" y="25" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">https://yourmarketplace.com/services/home-cleaning</text>
    <rect x="560" y="10" width="100" height="22" rx="6" fill="#3b82f6" />
    <text x="610" y="25" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">BOOK SERVICE</text>

