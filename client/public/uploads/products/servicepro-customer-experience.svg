        <text x="16" y="86" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">₹4,499</text>
        <text x="85" y="86" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" text-decoration="line-through">₹6,800</text>
