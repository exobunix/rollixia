          <text x="0" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">✓ 3 Vetted Professionals</text>
          <text x="0" y="50" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">✓ Balcony + Window Wash</text>
