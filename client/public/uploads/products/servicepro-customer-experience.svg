        <rect width="320" height="52" rx="14" fill="url(#cxPrimary)" />
        <text x="160" y="32" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" text-anchor="middle">CONFIRM &amp; PAY SECURELY →</text>
