      <text x="16" y="32" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">1 BHK Deep Clean</text>
      <text x="16" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Kitchen, bath, floors &amp; dusting</text>
      <text x="16" y="86" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">₹1,499</text>
      <text x="85" y="86" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" text-decoration="line-through">₹2,200</text>
