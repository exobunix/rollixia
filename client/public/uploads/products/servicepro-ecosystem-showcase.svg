<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="280" fill="#6366f1" opacity="0.12" filter="blur(80px)" />
  <circle cx="900" cy="400" r="320" fill="#06b6d4" opacity="0.1" filter="blur(90px)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 40)">
    <rect width="240" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.5" />
    <text x="120" y="21" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">COMPLETE 4-IN-1 ECOSYSTEM</text>
    <text x="0" y="70" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">ServicePro Unified Marketplace Platform</text>
    <text x="0" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15">Customer Web • Customer Mobile App • Partner App • Master Admin Panel</text>
  </g>

  <!-- 1. Master Admin Panel (Desktop Preview Left/Center) -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="580" height="460" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <!-- Window Bar -->
    <rect width="580" height="42" rx="16" fill="#1e293b" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="80" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">🖥️ Admin Dispatch &amp; Operations Console</text>
    <rect x="460" y="10" width="100" height="22" rx="6" fill="#6366f1" />
    <text x="510" y="25" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">LIVE DISPATCH</text>

    <!-- Admin Content: Stats row -->
    <g transform="translate(20, 60)">
      <!-- KPI 1 -->
      <rect width="125" height="70" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="14" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Total Bookings</text>
      <text x="14" y="52" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">4,829</text>

      <!-- KPI 2 -->
      <rect x="138" width="125" height="70" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="152" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Active Partners</text>
      <text x="152" y="52" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">342</text>

      <!-- KPI 3 -->
      <rect x="276" width="125" height="70" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="290" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Commission (15%)</text>
      <text x="290" y="52" fill="#10b981" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">₹6.4L</text>

      <!-- KPI 4 -->
      <rect x="414" width="125" height="70" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="428" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Avg Completion</text>
      <text x="428" y="52" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">98.4%</text>
    </g>

    <!-- Admin Booking Table -->
    <g transform="translate(20, 145)">
      <text x="0" y="16" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">Recent Service Bookings &amp; Auto-Assignment</text>
      <rect y="28" width="540" height="260" rx="8" fill="#141e33" stroke="rgba(255,255,255,0.08)" />

      <!-- Row 1 -->
      <g transform="translate(14, 52)">
        <text x="0" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700">#BK-9481</text>
        <text x="80" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Deep AC Jet Cleaning</text>
        <text x="260" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Assigned: Vikram S. (⭐ 4.9)</text>
        <rect x="420" y="-12" width="85" height="20" rx="10" fill="rgba(16,185,129,0.2)" />
        <text x="462" y="2" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">COMPLETED</text>
      </g>
      <line x1="14" y1="92" x2="526" y2="92" stroke="rgba(255,255,255,0.06)" />

      <!-- Row 2 -->
      <g transform="translate(14, 118)">
        <text x="0" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700">#BK-9482</text>
        <text x="80" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Full Home Sanitization</text>
        <text x="260" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Assigned: Rajesh M. (⭐ 4.8)</text>
        <rect x="420" y="-12" width="85" height="20" rx="10" fill="rgba(6,182,212,0.2)" />
        <text x="462" y="2" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">IN PROGRESS</text>
      </g>
      <line x1="14" y1="158" x2="526" y2="158" stroke="rgba(255,255,255,0.06)" />

      <!-- Row 3 -->
      <g transform="translate(14, 184)">
        <text x="0" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700">#BK-9483</text>
        <text x="80" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Main Switchboard Repair</text>
        <text x="260" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Awaiting Dispatch (Zone 4)</text>
        <rect x="420" y="-12" width="85" height="20" rx="10" fill="rgba(245,158,11,0.2)" />
        <text x="462" y="2" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">DISPATCHING</text>
      </g>
      <line x1="14" y1="224" x2="526" y2="224" stroke="rgba(255,255,255,0.06)" />

      <!-- Row 4 -->
      <g transform="translate(14, 250)">
        <text x="0" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700">#BK-9484</text>
        <text x="80" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Kitchen Pipe Replacement</text>
        <text x="260" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Scheduled for Tomorrow 10 AM</text>
        <rect x="420" y="-12" width="85" height="20" rx="10" fill="rgba(99,102,241,0.2)" />
        <text x="462" y="2" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">SCHEDULED</text>
      </g>
    </g>
  </g>

  <!-- 2. Customer Mobile App (Center Right Phone Mockup) -->
  <g transform="translate(680, 130)" filter="url(#cardShadow)">
    <rect width="220" height="450" rx="32" fill="#020617" stroke="#334155" stroke-width="4" />
    <!-- Notch -->
    <rect x="75" y="10" width="70" height="16" rx="8" fill="#1e293b" />
    <circle cx="130" cy="18" r="3" fill="#0f172a" />

    <!-- App Header -->
    <g transform="translate(16, 40)">
      <text x="0" y="18" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14" font-weight="800">ServicePro Customer</text>
      <text x="0" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">📍 Mumbai, Andheri West</text>

      <!-- Category Badges -->
      <g transform="translate(0, 48)">
        <rect width="42" height="42" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
        <text x="21" y="26" font-size="18" text-anchor="middle">🧹</text>
        <rect x="48" width="42" height="42" rx="10" fill="#1e293b" />
        <text x="69" y="26" font-size="18" text-anchor="middle">⚡</text>
        <rect x="96" width="42" height="42" rx="10" fill="#1e293b" />
        <text x="117" y="26" font-size="18" text-anchor="middle">🔧</text>
        <rect x="144" width="42" height="42" rx="10" fill="#1e293b" />
        <text x="165" y="26" font-size="18" text-anchor="middle">❄️</text>
      </g>

      <!-- Active Booking Card -->
      <g transform="translate(0, 106)">
        <rect width="188" height="120" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
        <rect x="10" y="10" width="70" height="18" rx="9" fill="#10b981" />
        <text x="45" y="23" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">TECH ARRIVED</text>
        <text x="10" y="48" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="800">Master AC Repair</text>
        <text x="10" y="66" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Vikram S. • ⭐ 4.9 (142 reviews)</text>
        <rect x="10" y="80" width="168" height="28" rx="6" fill="#6366f1" />
        <text x="94" y="98" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Verify OTP: 4821</text>
      </g>

      <!-- Popular Services -->
      <g transform="translate(0, 240)">
        <text x="0" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">POPULAR PACKAGES</text>
        <rect y="22" width="188" height="50" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
        <text x="12" y="44" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Bathroom Deep Clean</text>
        <text x="12" y="60" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="700">₹499 • 60 mins</text>
        <rect x="135" y="34" width="42" height="24" rx="6" fill="#3b82f6" />
        <text x="156" y="50" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">+ Add</text>
      </g>
    </g>
  </g>

  <!-- 3. Partner / Service Provider Mobile App (Far Right Phone Mockup) -->
  <g transform="translate(930, 160)" filter="url(#cardShadow)">
    <rect width="220" height="450" rx="32" fill="#020617" stroke="#334155" stroke-width="4" />
    <!-- Notch -->
    <rect x="75" y="10" width="70" height="16" rx="8" fill="#1e293b" />
    <circle cx="130" cy="18" r="3" fill="#0f172a" />

    <!-- Partner App Header -->
    <g transform="translate(16, 40)">
      <text x="0" y="18" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14" font-weight="800">Partner Job Portal</text>
      <rect x="125" y="4" width="60" height="18" rx="9" fill="rgba(16,185,129,0.2)" stroke="#10b981" />
      <text x="155" y="17" fill="#10b981" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>

      <!-- Earnings Widget -->
      <g transform="translate(0, 36)">
        <rect width="188" height="70" rx="12" fill="#14281d" stroke="#10b981" stroke-width="1.5" />
        <text x="12" y="24" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10" font-weight="700">TODAY'S EARNINGS</text>
        <text x="12" y="52" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="900">₹3,420</text>
        <text x="110" y="52" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="11">4 Completed</text>
      </g>

      <!-- Incoming Request Alert -->
      <g transform="translate(0, 120)">
        <rect width="188" height="150" rx="12" fill="#1f1a14" stroke="#f59e0b" stroke-width="1.5" />
        <rect x="10" y="10" width="80" height="18" rx="9" fill="#f59e0b" />
        <text x="50" y="23" fill="#000000" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">NEW DISPATCH</text>
        <text x="10" y="48" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="800">AC Power Trip Repair</text>
        <text x="10" y="66" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="10">Distance: 1.8 km • Bandra East</text>
        <text x="10" y="82" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Earn: ₹650 (Net)</text>

        <!-- Buttons -->
        <g transform="translate(10, 100)">
          <rect width="80" height="34" rx="8" fill="#ef4444" />
          <text x="40" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Decline</text>
          <rect x="88" width="80" height="34" rx="8" fill="#10b981" />
          <text x="128" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Accept</text>
        </g>
      </g>
    </g>
  </g>
</svg>
