          <text x="775" y="0" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" text-anchor="end">₹2,299</text>
        </g>
        <line x1="20" y1="120" x2="805" y2="120" stroke="rgba(255,255,255,0.04)" />

        <!-- Row 2 -->
        <g transform="translate(20, 144)">
          <text x="0" y="0" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">#BK-9041</text>
          <text x="110" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12">AC Filter Cleaning &amp; Gas</text>
          <text x="280" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Amitabh V. (Whitefield)</text>
          <text x="440" y="0" fill="#818cf8" font-family="'Inter', sans-serif" font-size="12">Suresh Cool Tech</text>
          <rect x="605" y="-14" width="75" height="20" rx="10" fill="rgba(59, 130, 246, 0.15)" />
          <text x="642" y="0" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ASSIGNED</text>
          <text x="775" y="0" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" text-anchor="end">₹1,850</text>
