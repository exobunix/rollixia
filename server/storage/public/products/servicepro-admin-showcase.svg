        <!-- Row 4 -->
        <g transform="translate(20, 224)">
          <text x="0" y="0" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">#BK-9039</text>
          <text x="110" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12">Full Home Painting (3 BHK)</text>
          <text x="280" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Deepak Joshi (HSR Layout)</text>
          <text x="440" y="0" fill="#10b981" font-family="'Inter', sans-serif" font-size="12">✓ UrbanColors Team</text>
          <rect x="605" y="-14" width="75" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" />
          <text x="642" y="0" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">COMPLETED</text>
