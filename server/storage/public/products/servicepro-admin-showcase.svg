    <text x="0" y="70" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5">ServicePro Master Admin Dashboard</text>
    <text x="0" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Manage customers, partners, categories, bookings, commissions &amp; payouts from a single dashboard</text>
  </g>

