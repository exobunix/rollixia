          <text x="0" y="0" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">#BK-9040</text>
          <text x="110" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12">Kitchen Sink Pipe Repair</text>
          <text x="280" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Kavita M. (Koramangala)</text>
          <text x="440" y="0" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="12">⚠️ Pending Assignment</text>
          <rect x="605" y="-14" width="75" height="20" rx="10" fill="rgba(245, 158, 11, 0.15)" />
          <text x="642" y="0" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">QUEUED</text>
          <text x="775" y="0" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" text-anchor="end">₹649</text>
