    <circle cx="26" cy="23" r="5" fill="#ef4444" />
    <circle cx="42" cy="23" r="5" fill="#f59e0b" />
    <circle cx="58" cy="23" r="5" fill="#10b981" />
    <text x="86" y="28" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ServicePro Admin Console — Operations &amp; Commission Dispatch</text>
    
    <g transform="translate(860, 11)">
