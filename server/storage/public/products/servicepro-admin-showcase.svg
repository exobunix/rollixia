<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="admBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="admShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#admBg)" />
  <circle cx="200" cy="180" r="280" fill="#8b5cf6" opacity="0.12" filter="blur(90px)" />
  <circle cx="1000" cy="400" r="300" fill="#3b82f6" opacity="0.1" filter="blur(90px)" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="390" x2="1200" y2="390" />
    <line x1="0" y1="520" x2="1200" y2="520" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(60, 36)">
